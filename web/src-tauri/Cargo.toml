[package]
name = "apanel-desktop"
version = "0.1.0"
description = "APanel standalone desktop client"
authors = ["Axolotland Gaming Club (AxoGC)"]
license = "GPL-3.0"
repository = "https://github.com/axogc/apanel"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Strips Rust debug symbols from release builds (desktop and Android alike)
# so a "release" APK/binary doesn't ship an unstripped .so full of debuginfo.
# lto/codegen-units=1 trade longer release builds for a smaller .so, worth
# it since this profile is only ever built for distribution, not iterated on.
[profile.release]
strip = true
lto = true
codegen-units = 1
